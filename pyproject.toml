# Documentation de poetry: https://python-poetry.org/docs/pyproject/

[tool.poetry]
name = "eoqual-neural"
version = "0.1.0"
description = "Neural networks for image restoration in Earth observation, organised by role (learned denoisers, unrolled networks)"
authors = ["Olivier Amram <olivier.amram@free.fr>"]
maintainers = [
    "Olivier Amram <olivier.amram@free.fr>"
]
repository = "https://github.com/EOQual/eoqual-neural.git"
readme = "README.md"
license = "MIT"
keywords = ["deep-learning", "denoising", "deconvolution", "unrolled-network", "remote-sensing", "earth-observation"]
packages = [{include = "eoqual/neural", from = "src"}]
exclude = [
    "**/__pycache__",
    "**/.DS_Store",
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
numpy = "*"
# PyTorch : BSD-3-Clause. Toutes les méthodes du paquet en dépendent ; c'est
# la dépendance lourde que les modules par tâche n'ont plus à porter.
torch = ">=2.2"
# DeepInverse (code et poids DRUNet : BSD-3-Clause) : débruiteurs appris.
deepinv = "*"
# einops (MIT) : requis par certains réseaux de deepinv (Restormer, SwinIR).
einops = "*"

[tool.poetry.group.docs.dependencies]
sphinx = "*"
sphinx-rtd-theme = "*"
sphinx-autoapi = "*"

[tool.poetry.group.dev.dependencies]
poetry = "^2.1.1"
ipython = "^8.8.0"
black = "^23.3.0"
coverage = "^6.5.0"
pylint = "*"
pytest = "<9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
