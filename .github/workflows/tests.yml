name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Libérer de l'espace disque
        run: |
          # PyTorch pour Linux tire les bibliothèques CUDA (plusieurs Go) :
          # on retire du runner des outils inutiles ici (.NET, Android, GHC, CodeQL).
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Installer Poetry et les dépendances du projet
        run: |
          pip install --upgrade pip
          pip install poetry
          poetry install --with=dev --no-cache --verbose

      - name: Tests
        run: poetry run pytest -q
